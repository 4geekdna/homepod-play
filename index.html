<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <title>Bedroom HomePod</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>Bedroom HomePod</h1>
    <p class="sub" id="status-line">Home Assistant play / pause</p>
  </header>

  <main class="main">
    <div class="now-playing" id="now-playing">Not connected</div>

    <div class="controls">
      <button class="btn" id="btn-play" type="button">Play</button>
      <button class="btn" id="btn-pause" type="button">Pause</button>
    </div>
    <div class="controls">
      <button class="btn secondary" id="btn-toggle" type="button">Play / Pause</button>
      <button class="btn secondary" id="btn-stop" type="button">Stop</button>
    </div>

    <button class="btn shortcut" id="btn-shortcut" type="button">Start playlist (Shortcuts)</button>

    <details class="settings" id="settings" open>
      <summary>Home Assistant setup</summary>
      <label>HA URL
        <input type="url" id="ha-url" placeholder="https://homeassistant.local:8123" />
      </label>
      <label>Long-lived token
        <input type="password" id="ha-token" placeholder="Paste token" autocomplete="off" />
      </label>
      <label>Media player entity
        <input type="text" id="ha-entity" placeholder="media_player.bedroom_homepod" />
      </label>
      <button class="btn secondary" id="btn-save" type="button">Save &amp; test</button>
      <p class="help">Token stays only on this phone. HA must allow this page origin (see README).</p>
    </details>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
